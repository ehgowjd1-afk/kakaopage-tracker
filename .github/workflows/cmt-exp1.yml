name: 회차 댓글 분석 묶음 규칙 시험

# scripts/cmt/cmt_exp1.mjs 를 손으로만 돌립니다 (자동 실행 없음). 매일 수집과는 따로입니다.
# 시범 때 고른 댓글 목록(state/cmt/*.json — 원문 없음)을 카카오에서 uid로 다시 받아, 새 묶음 규칙(1단계)으로 묶음을 정하고
# 그 묶음으로 댓글 표시(2단계)·불만 재확인을 합니다. 결과(묶음·댓글 번호별 표시 — 원문 없음)는 하루 보관 실행 결과물로,
# 저장소에는 이 달 AI 사용액(state/ai_state.json)만 커밋합니다. 월 AI 한도 $30.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "댓글 목록 파일 (state/cmt/ 안)"
        type: string
        default: "state/cmt/pilot1.json"
      reps:
        description: "같은 규칙으로 몇 번 따로 돌릴지(흔들림 확인, 1~3)"
        type: string
        default: "2"
      effort:
        description: "2단계(Haiku) 생각량"
        type: choice
        options: [low, medium, high]
        default: low
      recheck:
        description: "재확인 모델 — sonnet@medium / haiku@high / none"
        type: string
        default: "sonnet@medium"
      fill:
        description: "빠진 반응 채우기(묶음 없는 댓글에서 묶음 보태기)"
        type: choice
        options: ["on", "off"]
        default: "on"
      from_run:
        description: "이전 시험 실행 번호 — 넣으면 그 결과(하루 보관)에 빠진 반응 채우기만 돌림"
        type: string
        default: ""
      cap_usd:
        description: "이번 시험 비용 상한(달러) — 예상이 넘으면 보내지 않음"
        type: string
        default: "2"

permissions:
  contents: write
  actions: read

# AI 작업끼리 겹치지 않게 (돈 기록 파일을 같이 씀)
concurrency:
  group: ai-kakao
  cancel-in-progress: false

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Claude SDK 설치
        run: |
          mkdir -p /tmp/sdk && cd /tmp/sdk && npm init -y >/dev/null && npm install --no-audit --no-fund @anthropic-ai/sdk@0.128.0
          ln -s /tmp/sdk/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: 이전 결과 받기
        if: ${{ inputs.from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          [[ "$FROM_RUN" =~ ^[0-9]+$ ]] || { echo "실행 번호는 숫자"; exit 1; }
          mkdir -p /tmp/prev && gh run download "$FROM_RUN" -n cmt-exp1-out -D /tmp/prev -R "$GITHUB_REPOSITORY"
          ls -la /tmp/prev

      # 입력값은 환경 변수로 넘긴다 (명령줄에 바로 붙이지 않음). 형식이 이상하면 스크립트가 멈춘다.
      - name: 시험 실행
        timeout-minutes: 120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPEC: ${{ inputs.spec }}
          REPS: ${{ inputs.reps }}
          EFFORT: ${{ inputs.effort }}
          CAP_USD: ${{ inputs.cap_usd }}
          RECHECK: ${{ inputs.recheck }}
          FILL: ${{ inputs.fill }}
          FROM: ${{ inputs.from_run != '' && '/tmp/prev/cmt_exp1_out.json' || '' }}
        run: >
          node scripts/cmt/cmt_exp1.mjs --spec "$SPEC" --reps "$REPS" --effort "$EFFORT" --recheck "$RECHECK" --fill "$FILL"
          ${FROM:+--from "$FROM"}
          --cap-usd "$CAP_USD" --limit-usd 30 --wait-min 100
          --out cmt_exp1_out.json --summary "$GITHUB_STEP_SUMMARY"

      - name: 결과 올리기 (하루 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmt-exp1-out
          path: cmt_exp1_out.json
          retention-days: 1
          if-no-files-found: ignore

      - name: AI 사용액 저장(커밋)
        if: always()
        run: |
          rm -f node_modules
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add state/ai_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -q -m "회차 댓글 묶음 규칙 시험: AI 사용액 기록"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then echo "저장 완료"; exit 0; fi
            echo "다른 수집과 겹쳤습니다. 합치고 다시 시도 ($i/5)"
            git fetch -q origin master && git rebase -q origin/master || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 5))
          done
          echo "저장 실패"; exit 1
