name: 회차 분량 (웹툰, 매주)

# scripts/collect-episode-length.mjs — 웹툰 회차마다 이미지 장 수(=분량)와 용량을 docs/data/eplen/에 모은다.
# 사용자 요청(2026-10-19): "회차분량은 크롤링하자, 매주". 매일 수집·댓글 수집·회차별 댓글 수와 완전히 따로 돈다.
# 월요일 14:30 KST에 시작(다른 카카오 수집이 없는 시간), 00:30 KST(15:30 UTC) 전에는 반드시 멈춘다 — 01:00 KST 회차별 댓글 수 작업과 안 겹치게.
# 처음엔 웹툰 전부(약 4천 작품), 그다음부터는 연재 중 작품의 새 회차만 받는다(대개 작품당 요청 1번).
# 카카오 요청 사이 2초, 3번 연속 실패하면 멈추고 그때까지 받은 것만 저장한다. 웹소설은 분량 값이 없어 받지 않는다.

on:
  schedule:
    - cron: '30 5 * * 1'   # 월요일 14:30 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: "최대 실행 시간(분)"
        type: string
        default: "540"

permissions:
  contents: write

concurrency:
  group: eplen
  cancel-in-progress: false

jobs:
  length:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 회차 분량 받기
        timeout-minutes: 580
        env:
          MINUTES: ${{ inputs.minutes || '540' }}
        run: node scripts/collect-episode-length.mjs --minutes "$MINUTES" --stop-utc 15:30

      - name: 저장(커밋)
        if: always()
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data/eplen 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -q -m "회차 분량 갱신 ($(TZ=Asia/Seoul date +%F))"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then echo "저장 완료"; exit 0; fi
            echo "다른 수집과 겹쳤습니다. 합치고 다시 시도 ($i/5)"
            git fetch -q origin master && git rebase -q origin/master || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 10))
          done
          echo "저장 실패"; exit 1
