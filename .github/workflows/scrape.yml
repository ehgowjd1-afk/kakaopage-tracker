name: Daily Kakao Page scrape

on:
  # Primary run ~09:17 KST (00:17 UTC), plus safety-net runs ~12:17 and ~15:17
  # KST. Times are deliberately off the top of the hour: GitHub delays/drops
  # scheduled runs most at round times like 00:00 UTC (global cron rush), which
  # is why the 09:00 run was sometimes skipped. Each backup skips itself if
  # today's data is already collected, so extra runs cost nothing on normal
  # days and only scrape when an earlier run was missed.
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 3 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's data was already collected
        id: guard
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          if [ -f "docs/data/webnovel/daily/$TODAY.json" ]; then
            echo "Today's data ($TODAY) already present — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data yet for $TODAY — proceeding to scrape."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - run: npm install
        if: steps.guard.outputs.skip != 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.guard.outputs.skip != 'true'

      - run: npm run scrape
        if: steps.guard.outputs.skip != 'true'

      - name: Commit and push updated data
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Author MUST be the real account, not a bot email: Vercel's deploy
          # protection blocks deploys for commits whose author isn't a team
          # member, so a bot-authored data commit lands in git but never
          # reaches the live site.
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: daily ranking data $(date -u +%Y-%m-%d)"
          # Re-sync before pushing in case anything else landed on master
          # while the (long) scrape was running, so the push can't be rejected.
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Trigger Vercel deploy
        if: ${{ steps.guard.outputs.skip != 'true' && env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$HOOK"
