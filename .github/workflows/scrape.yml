name: Daily Kakao Page scrape

on:
  # Runs daily at 00:00 UTC = 09:00 KST. GitHub's scheduled runs are
  # best-effort (can be delayed by a few minutes to ~an hour), which is fine
  # for a once-a-day snapshot. This is the primary daily driver; the opaque
  # cloud routine (whose logs we can't inspect) has been disabled.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run scrape

      - name: Commit and push updated data
        run: |
          # Author MUST be the real account, not a bot email: Vercel's deploy
          # protection blocks deploys for commits whose author isn't a team
          # member, so a bot-authored data commit lands in git but never
          # reaches the live site.
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: daily ranking data $(date -u +%Y-%m-%d)"
          # Re-sync before pushing in case anything else landed on master
          # while the (long) scrape was running, so the push can't be rejected.
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Trigger Vercel deploy
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$HOOK"
