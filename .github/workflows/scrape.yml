name: Daily Kakao Page scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run scrape

      - name: Commit and push updated data
        run: |
          git config user.name "kakaopage-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: daily ranking data $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger Vercel deploy
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$HOOK"
