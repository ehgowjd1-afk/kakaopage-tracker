name: Daily Kakao Page scrape

on:
  # Scheduled trigger disabled: GitHub's scheduled runs are best-effort and
  # were often delayed/skipped, so the daily job is driven by the reliable
  # cloud routine instead. This workflow stays available for manual runs.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run scrape

      - name: Commit and push updated data
        run: |
          git config user.name "kakaopage-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: daily ranking data $(date -u +%Y-%m-%d)"
          # Re-sync before pushing in case anything else landed on master
          # while the (long) scrape was running, so the push can't be rejected.
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break
            echo "push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Trigger Vercel deploy
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$HOOK"
