name: Daily Kakao Page scrape

on:
  # Daily runs at 07:15 KST (22:15 UTC) plus safety-net retries ~10:15 and
  # ~13:15 KST. The repo is public, so GitHub Actions minutes are unlimited and
  # free (the private-repo 2,000/mo cap that ran out on 2026-09-27 no longer
  # applies). Each backup skips itself when today's data is already collected.
  schedule:
    - cron: '15 22 * * *'
    - cron: '15 1 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's data was already collected
        id: guard
        run: |
          # Use KST, not UTC: scrape.mjs names snapshot files by the Korea date,
          # and the 07:15 KST run happens while UTC is still the previous day, so
          # a UTC check would always see "yesterday" already collected and skip.
          TODAY="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          if [ -f "docs/data/webnovel/daily/$TODAY.json" ]; then
            echo "Today's data ($TODAY KST) already present — skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data yet for $TODAY KST — proceeding to scrape."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - run: npm install
        if: steps.guard.outputs.skip != 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.guard.outputs.skip != 'true'

      - run: npm run scrape
        if: steps.guard.outputs.skip != 'true'

      - name: Commit and push updated data
        if: steps.guard.outputs.skip != 'true'
        env:
          GIT_EDITOR: 'true'
        run: |
          # Author MUST be the real account, not a bot email: Vercel's deploy
          # protection blocks deploys for commits whose author isn't a team
          # member, so a bot-authored data commit lands in git but never
          # reaches the live site.
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          # Commit message uses the KST date, matching the snapshot file names.
          MSG="chore: daily ranking data $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "$MSG"
          # Re-sync before pushing. index.json is fully derived from the data
          # files, so if it conflicts (e.g. another writer landed a different
          # day) we take the remote copy and rebuild it from the union of files
          # instead of letting a text conflict block the push.
          for i in 1 2 3 4 5; do
            git fetch origin master
            git merge -X theirs --no-edit origin/master || {
              git checkout --theirs -- docs/data 2>/dev/null || true
              git add docs/data
              git commit --no-edit || true
            }
            node scripts/write-index.mjs
            git add docs/data/index.json
            git diff --cached --quiet || git commit -m "chore: rebuild index"
            if git push origin master; then echo "pushed"; exit 0; fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after retries"; exit 1

      - name: Trigger Vercel deploy
        if: ${{ steps.guard.outputs.skip != 'true' && env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -X POST "$HOOK"
