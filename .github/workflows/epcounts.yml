name: 회차별 댓글 수 (전 작품)

# scripts/collect-episode-counts.mjs — 작품 상세의 '회차별 댓글 수' 막대그래프용 숫자 표(docs/data/epcounts/)를 채운다.
# 매일 수집·댓글 수집과 완전히 따로 돈다: 새벽 01:00 KST에 시작해 06:30 KST 전에 멈추고(매일 수집은 07:15 시작),
# 그때까지 센 것만 저장한다. 다음 날 이어서 채운다(지금 순위권 → 순위에 든 적 있는 작품 → 나머지).
# 이미 센 작품은 일주일에 한 번, 댓글이 늘었을 때만 최근 회차를 다시 센다(4주에 한 번은 전 회차).
# 카카오 요청 사이 2초, 429/503이 2번 연속이면 멈춘다. 댓글 원문·닉네임은 저장하지 않는다(숫자만).

on:
  schedule:
    - cron: '0 16 * * *'   # 01:00 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: "최대 실행 시간(분)"
        type: string
        default: "290"

permissions:
  contents: write

concurrency:
  group: epcounts
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 21:30 UTC = 06:30 KST 에는 반드시 멈춘다 (예약 실행이 늦게 시작해도)
      - name: 회차별 댓글 수 세기
        timeout-minutes: 320
        env:
          MINUTES: ${{ inputs.minutes || '290' }}
        run: node scripts/collect-episode-counts.mjs --minutes "$MINUTES" --stop-utc 21:30

      - name: 저장(커밋)
        if: always()
        run: |
          git config user.name "ehgowjd1-afk"
          git config user.email "ehgowjd1@gmail.com"
          git add docs/data/epcounts 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git commit -q -m "회차별 댓글 수 갱신 ($(TZ=Asia/Seoul date +%F))"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then echo "저장 완료"; exit 0; fi
            echo "다른 수집과 겹쳤습니다. 합치고 다시 시도 ($i/5)"
            git fetch -q origin master && git rebase -q origin/master || { git rebase --abort 2>/dev/null || true; }
            sleep $((i * 10))
          done
          echo "저장 실패"; exit 1
